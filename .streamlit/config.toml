[theme]
base = "dark"
primaryColor = "#57e7d6"
backgroundColor = "#061014"
secondaryBackgroundColor = "#0a171c"
textColor = "#e8f3f2"
font = "sans serif"

[server]
headless = true
runOnSave = false
# Serves ./static (the vendored three.js for the 3D player) at /app/static.
enableStaticServing = true

[browser]
gatherUsageStats = false
