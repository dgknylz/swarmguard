<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg: #050c10; --panel: rgba(8, 20, 26, 0.86); --line: rgba(140, 200, 205, 0.14);
    --text: #e6f4f2; --muted: #7f989d; --mint: #5eead4; --cyan: #38bdf8; --red: #fb7185;
    --amber: #fbbf24; --violet: #a78bfa; --dock: 96px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; color: var(--text);
    font: 12px/1.45 Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; overflow: hidden; }
  #root { position: relative; height: 100%; overflow: hidden; border: 1px solid var(--line); border-radius: 18px;
    background: radial-gradient(900px 520px at 78% -12%, rgba(56, 189, 248, 0.09), transparent 62%),
      radial-gradient(760px 460px at 6% 112%, rgba(94, 234, 212, 0.08), transparent 60%), var(--bg); }
  #root.compact { --dock: 6px; }
  #stage { position: absolute; inset: 0 0 var(--dock) 0; cursor: crosshair; outline: none; }
  canvas { display: block; }
  .glass { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    backdrop-filter: blur(14px); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35); }
  #hud { position: absolute; top: 14px; left: 14px; width: 248px; padding: 12px 14px; pointer-events: none; }
  #hud .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  #hud .time { font: 700 22px/1 "JetBrains Mono", Consolas, monospace; letter-spacing: -0.02em; }
  #hud .time small { color: var(--muted); font-size: 12px; }
  .pill { padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted);
    font-size: 9px; font-weight: 800; letter-spacing: 0.12em; }
  .pill.live { color: var(--mint); border-color: rgba(94, 234, 212, 0.4); }
  .label { color: var(--muted); font-size: 9px; font-weight: 800; letter-spacing: 0.12em; }
  .metric { margin-top: 10px; }
  .metric strong { font: 700 15px "JetBrains Mono", Consolas, monospace; }
  .bar { height: 5px; margin-top: 5px; border-radius: 9px; background: rgba(255, 255, 255, 0.06); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 9px;
    background: linear-gradient(90deg, #f43f5e, #fb7185); transition: width 0.25s ease; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .grid2 div { display: flex; flex-direction: column; }
  .grid2 b { font: 700 13px "JetBrains Mono", Consolas, monospace; }
  .sigma { margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--line); }
  .sigma b { font: 700 14px "JetBrains Mono", Consolas, monospace; }
  .sigma .verdict { margin-top: 3px; font-size: 10.5px; color: var(--muted); }
  .hot { color: var(--red); } .cool { color: var(--mint); }
  #defense { margin-top: 9px; color: var(--muted); font-size: 10.5px; }
  #legend { position: absolute; top: 14px; right: 14px; display: flex; flex-wrap: wrap; justify-content: flex-end;
    gap: 6px 12px; max-width: 46%; padding: 9px 12px; pointer-events: none; }
  #legend span { display: inline-flex; align-items: center; gap: 6px; color: #b7cbcb; font-size: 10.5px; white-space: nowrap; }
  #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
  #legend i.line { width: 16px; height: 0; border-radius: 0; border-top: 2px solid; }
  #inspector { position: absolute; right: 14px; bottom: calc(var(--dock) + 14px); width: 270px; padding: 14px; display: none; }
  #inspector.open { display: block; }
  #inspector h3 { margin: 0; font-size: 16px; letter-spacing: -0.01em; }
  #inspector .badge { display: inline-block; margin-top: 6px; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 800; }
  #inspector table { width: 100%; margin-top: 10px; border-collapse: collapse; }
  #inspector td { padding: 4px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
  #inspector td:last-child { text-align: right; font: 600 11.5px "JetBrains Mono", Consolas, monospace; }
  #inspector .note { margin-top: 9px; padding: 8px 10px; border-radius: 10px; color: #c9dcdb; font-size: 10.5px;
    background: rgba(56, 189, 248, 0.07); border: 1px solid rgba(56, 189, 248, 0.18); }
  #inspector button { position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; border: 0; border-radius: 8px;
    color: var(--muted); background: rgba(255, 255, 255, 0.05); cursor: pointer; }
  #feed { position: absolute; left: 14px; bottom: calc(var(--dock) + 14px); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  #feed div { padding: 6px 10px; border-radius: 10px; font-size: 11px; background: var(--panel); border: 1px solid var(--line);
    transition: opacity 0.6s ease, transform 0.6s ease; }
  #tip { position: absolute; padding: 5px 8px; border-radius: 8px; font-size: 11px; pointer-events: none; display: none;
    background: rgba(5, 12, 16, 0.92); border: 1px solid var(--line); white-space: nowrap; }
  #dock { position: absolute; left: 0; right: 0; bottom: 0; height: var(--dock); display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-top: 1px solid var(--line); background: rgba(4, 10, 13, 0.72); }
  .compact #dock, .compact #legend, .compact #inspector, .compact #feed { display: none !important; }
  .compact #hud { width: auto; padding: 9px 12px; }
  .compact #hud .extra { display: none; }
  #progress { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: linear-gradient(90deg, var(--mint), var(--cyan)); display: none; }
  .compact #progress { display: block; }
  .btn { display: grid; place-items: center; width: 38px; height: 38px; flex: 0 0 auto; border: 1px solid var(--line);
    border-radius: 12px; color: var(--text); background: rgba(255, 255, 255, 0.04); cursor: pointer; font-size: 14px; }
  .btn:hover { border-color: rgba(94, 234, 212, 0.45); }
  .btn.primary { width: 46px; height: 46px; color: #032b26; border: 0; background: linear-gradient(135deg, #5eead4, #38bdf8);
    box-shadow: 0 8px 22px rgba(56, 189, 248, 0.25); font-size: 16px; }
  #timeline { flex: 1 1 auto; height: 70px; min-width: 120px; border-radius: 12px; cursor: pointer; }
  .group { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { padding: 5px 7px; border: 0; color: var(--muted); background: transparent; font: 700 10.5px Inter, sans-serif; cursor: pointer; }
  .seg button.on { color: #032b26; background: var(--mint); }
  .seg button:disabled { opacity: 0.35; cursor: not-allowed; }
  #layernote { margin-top: 9px; padding: 8px 10px; border-radius: 10px; color: #d9e8e7; font-size: 10.5px; display: none;
    background: rgba(251, 191, 36, 0.06); border: 1px solid rgba(251, 191, 36, 0.22); }
  #layernote small { color: var(--muted); }
  #legend i.cbar { width: 64px; height: 8px; border-radius: 4px; }
  #view3d { position: absolute; inset: 0; display: none; cursor: grab; }
  #view3d:active { cursor: grabbing; }
  .note3d { position: absolute; left: 50%; bottom: calc(var(--dock) + 10px); transform: translateX(-50%); color: var(--muted);
    font-size: 10px; pointer-events: none; display: none; }
  #badge { display: none; margin-bottom: 8px; padding: 3px 9px; border-radius: 999px; font-size: 10px; font-weight: 800;
    letter-spacing: 0.08em; color: #032b26; background: linear-gradient(135deg, #5eead4, #38bdf8); }
  #finale { position: absolute; left: 50%; top: 46%; width: min(420px, 86%); padding: 18px 20px; transform: translate(-50%, -50%) scale(0.96);
    opacity: 0; pointer-events: none; transition: opacity 0.45s ease, transform 0.45s ease; text-align: center; }
  #finale.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
  #finale h2 { margin: 6px 0 12px; font-size: 19px; letter-spacing: -0.01em; }
  #finale .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; text-align: left; }
  #finale .stats div { padding: 8px 10px; border-radius: 10px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); }
  #finale .stats b { display: block; font: 700 16px "JetBrains Mono", Consolas, monospace; }
  #finale .verdict { margin: 12px 0 14px; font-size: 11.5px; color: #c9dcdb; }
  #finale .actions { display: flex; gap: 8px; justify-content: center; }
  #finale button { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); color: var(--text); background: rgba(255, 255, 255, 0.05);
    font: 700 11px Inter, sans-serif; cursor: pointer; }
  #finale button.primary { border: 0; color: #032b26; background: linear-gradient(135deg, #5eead4, #38bdf8); }
  @media (max-width: 760px) {
    /* Half-width players (duel mode): keep play, timeline, math layers and 2D/3D. */
    #hud { width: 190px; padding: 10px 12px; } #hud .grid2, #defense { display: none; }
    #legend { display: none; } .group.toggles, .group.speeds { display: none; } #inspector { width: 220px; }
    #dock { gap: 8px; padding: 8px 10px; } .btn { width: 32px; height: 32px; } .btn.primary { width: 40px; height: 40px; }
    .seg button { padding: 5px 6px; }
  }
</style>
</head>
<body>
<div id="root">
  <div id="stage" tabindex="0"><canvas id="view"></canvas></div>
  <div id="hud" class="glass">
    <span id="badge"></span>
    <div class="row"><div class="time" id="time">t 0</div><span class="pill" id="status">HAZIR</span></div>
    <div class="metric"><div class="row"><span class="label">ENFEKTE İHA</span><strong id="inf">0</strong></div><div class="bar"><i id="infbar"></i></div></div>
    <div class="grid2 extra">
      <div><span class="label">EN BÜYÜK BİLEŞEN</span><b id="gcc">–</b></div>
      <div><span class="label">λ₂ BAĞLANTILILIK</span><b id="l2">–</b></div>
    </div>
    <div class="sigma extra" title="σ(t) = 1 − γ + β·λ₁(A(t)). Teorem 2: σ'nın geometrik ortalaması 1'in altındaysa beklenen enfekte sayısı üstel olarak söner.">
      <div class="row"><span class="label">SPEKTRAL BASKI σ(t)</span><b id="sigma">–</b></div>
      <div class="verdict" id="verdict">–</div>
    </div>
    <div id="layernote" class="extra"></div>
    <div id="defense" class="extra"></div>
  </div>
  <div id="legend" class="glass"></div>
  <div id="inspector" class="glass"><button id="close" title="Kapat">✕</button><div id="inspect"></div></div>
  <div id="feed"></div>
  <div id="tip"></div>
  <div id="finale" class="glass"></div>
  <div class="note3d" id="note3d">Sürükle: döndür · Tekerlek: yakınlaştır · Tıkla: İHA seç — irtifa yalnızca görseldir, model 2B'dir</div>
  <div id="progress"></div>
  <div id="dock">
    <button class="btn" id="prev" title="Bir kare geri (←)">⏮</button>
    <button class="btn primary" id="play" title="Oynat / duraklat (boşluk)">▶</button>
    <button class="btn" id="next" title="Bir kare ileri (→)">⏭</button>
    <canvas id="timeline"></canvas>
    <div class="group speeds">
      <span class="label">HIZ</span>
      <div class="seg" id="speeds"></div>
    </div>
    <div class="group">
      <span class="label">MATEMATİK</span>
      <div class="seg" id="layers"></div>
    </div>
    <div class="group">
      <span class="label">GÖRÜNÜM</span>
      <div class="seg" id="views"></div>
    </div>
    <div class="group toggles">
      <span class="label">SEÇENEK</span>
      <div class="seg" id="toggles"></div>
    </div>
  </div>
</div>
<script id="swarm-data" type="application/json">__SWARM_DATA__</script>
<script>
(() => {
  "use strict";
  const DATA = JSON.parse(document.getElementById("swarm-data").textContent);
  const META = DATA.meta;
  const FR = DATA.frames;
  const N = META.n;
  const LAST = FR.length - 1;
  const COMPACT = !!META.compact;
  const $ = (id) => document.getElementById(id);
  const root = $("root"), stage = $("stage"), canvas = $("view"), ctx = canvas.getContext("2d");
  const tl = $("timeline"), tctx = tl.getContext("2d");
  if (COMPACT) root.classList.add("compact");

  const COLOR = { mint: [94, 234, 212], red: [251, 113, 133], amber: [251, 191, 36], cyan: [56, 189, 248],
    violet: [167, 139, 250], white: [236, 248, 246], edge: [130, 196, 202] };
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  const pad2 = (i) => String(i).padStart(2, "0");
  const pct = (x) => "%" + (100 * x).toFixed(1);
  const BASE_FPS = 2.4;
  const SPEEDS = [0.5, 1, 2, 4, 8];

  const state = { tau: 0, playing: !!META.autoplay, speed: 1, loop: COMPACT, range: false,
    labels: N <= 30 && !COMPACT, selected: -1, hover: -1, last: performance.now(), shown: -1, drag: false,
    layer: "health", mode: "2d" };
  const HAS_FIEDLER = FR.every((f) => Array.isArray(f.v));
  const DRONES = N <= 90;  // quadcopter glyphs while they stay readable, dots beyond
  let topo = null;

  // Per-frame caches ---------------------------------------------------------------
  const cache = { inf: [], det: [], quar: [], keys: [], adj: [], perron: new Map(), spec: [], tx: [] };
  // Source → target pairs of the infections that happen when frame k−1 turns into frame k:
  // the virus travels along an edge of graph k from a UAV that was infected at k−1.
  function transmissions(k) {
    if (cache.tx[k]) return cache.tx[k];
    const pairs = [];
    if (k > 0) {
      const before = infected(k - 1), lists = adjacency(k);
      for (const [kind, node] of FR[k].ev) {
        if (kind !== "infected") continue;
        for (const source of lists[node]) if (before.has(source)) pairs.push(source, node);
      }
    }
    return (cache.tx[k] = pairs);
  }
  const setOf = (store, k, list) => store[k] || (store[k] = new Set(list));
  const infected = (k) => setOf(cache.inf, k, FR[k].i);
  const detected = (k) => setOf(cache.det, k, FR[k].d);
  const quarantined = (k) => setOf(cache.quar, k, FR[k].q);
  function edgeKeys(k) {
    if (cache.keys[k]) return cache.keys[k];
    const keys = new Set(), e = FR[k].e;
    for (let j = 0; j < e.length; j += 2) keys.add(e[j] * N + e[j + 1]);
    return (cache.keys[k] = keys);
  }
  function adjacency(k) {
    if (cache.adj[k]) return cache.adj[k];
    const lists = Array.from({ length: N }, () => []), e = FR[k].e;
    for (let j = 0; j < e.length; j += 2) { lists[e[j]].push(e[j + 1]); lists[e[j + 1]].push(e[j]); }
    return (cache.adj[k] = lists);
  }
  function perron(k) {
    if (cache.perron.has(k)) return cache.perron.get(k);
    const lists = adjacency(k);
    let x = new Float64Array(N).fill(1 / Math.sqrt(N));
    for (let it = 0; it < 400; it++) {  // power iteration on A + I (same eigenvectors, no oscillation)
      const y = new Float64Array(N);
      let norm = 0;
      for (let i = 0; i < N; i++) { let s = x[i]; for (const j of lists[i]) s += x[j]; y[i] = s; norm += s * s; }
      norm = Math.sqrt(norm) || 1;
      let diff = 0;
      for (let i = 0; i < N; i++) { y[i] /= norm; diff += Math.abs(y[i] - x[i]); }
      x = y;
      if (diff < 1e-10) break;
    }
    const order = Array.from(x.keys()).sort((a, b) => x[b] - x[a]);
    const rank = new Int32Array(N);
    order.forEach((node, index) => (rank[node] = index + 1));
    const result = { u: x, rank };
    cache.perron.set(k, result);
    return result;
  }
  // Math layers: Perron weights uᵢ (who drives λ₁) and the Fiedler vector v (the weakest cut).
  function spectral(k) {
    if (cache.spec[k]) return cache.spec[k];
    const f = FR[k], u = f.u || Array.from(perron(k).u), v = f.v || null, e = f.e;
    let maxU = 0, maxV = 0, maxP = 0, cut = 0, top = 0;
    for (let i = 0; i < N; i++) { if (u[i] > maxU) { maxU = u[i]; top = i; } if (v) maxV = Math.max(maxV, Math.abs(v[i])); }
    for (let j = 0; j < e.length; j += 2) {
      maxP = Math.max(maxP, u[e[j]] * u[e[j + 1]]);
      if (v && v[e[j]] * v[e[j + 1]] < 0) cut++;
    }
    return (cache.spec[k] = { u, v, maxU: maxU || 1, maxV: maxV || 1, maxP: maxP || 1, cut, top });
  }
  const HEAT = [[30, 64, 175], [56, 189, 248], [250, 204, 21], [244, 63, 94]];
  function heat(x) {
    const t = Math.min(1, Math.max(0, x)) * (HEAT.length - 1), i = Math.min(HEAT.length - 2, Math.floor(t));
    return mix(HEAT[i], HEAT[i + 1], t - i);
  }
  function layerColor(i, k) {
    const s = spectral(k);
    if (state.layer === "perron") return heat(s.u[i] / s.maxU);
    if (!s.v) return [100, 116, 139];
    const x = s.v[i] / s.maxV;
    return mix([71, 85, 105], x >= 0 ? COLOR.cyan : COLOR.violet, Math.min(1, 0.3 + 0.7 * Math.abs(x)));
  }
  const sigmaAt = (k) => 1 - META.gamma + META.beta * FR[k].m[4];
  const logSigma = [0];
  for (let k = 1; k <= LAST; k++) logSigma.push(logSigma[k - 1] + Math.log(Math.max(sigmaAt(k), 1e-12)));
  const geometricSigma = (k) => (k < 1 ? NaN : Math.exp(logSigma[k] / k));
  const actionCount = FR.map((f) => f.ev.filter((e) => e[0] === "add_edge" || e[0] === "remove_edge" || e[0] === "quarantine_node").length);

  // Layout ---------------------------------------------------------------------------
  const view = { s: 1, ox: 0, oy: 0, w: 1, h: 1, dpr: 1, r: 6 };
  function layout() {
    const box = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, box.width * dpr); canvas.height = Math.max(1, box.height * dpr);
    canvas.style.width = box.width + "px"; canvas.style.height = box.height + "px";
    const padX = COMPACT ? 16 : 30, padTop = COMPACT ? 16 : 26, padBottom = COMPACT ? 16 : 26;
    const s = Math.min((box.width - 2 * padX) / META.w, (box.height - padTop - padBottom) / META.h);
    Object.assign(view, { s, ox: (box.width - META.w * s) / 2, oy: padTop + (box.height - padTop - padBottom - META.h * s) / 2,
      w: box.width, h: box.height, dpr, r: Math.max(3, Math.min(COMPACT ? 6.5 : 8.5, 210 / Math.sqrt(N))) });
    const tb = tl.getBoundingClientRect();
    tl.width = Math.max(1, tb.width * dpr); tl.height = Math.max(1, tb.height * dpr);
    topo = COMPACT ? null : buildTopo(Math.round(META.w * s * dpr), Math.round(META.h * s * dpr));
    layout3d();
  }
  const sx = (x) => view.ox + x * view.s;
  const sy = (y) => view.oy + (META.h - y) * view.s;

  // Drawing ----------------------------------------------------------------------------
  const pts = new Float64Array(2 * N);
  function niceStep(span) {
    const raw = span / 8, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
    return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
  }
  function drawArea() {
    const x0 = sx(0), y0 = sy(META.h), w = META.w * view.s, h = META.h * view.s;
    ctx.fillStyle = "rgba(9, 24, 30, 0.55)";
    ctx.fillRect(x0, y0, w, h);
    if (topo) ctx.drawImage(topo, x0, y0, w, h);
    const step = niceStep(Math.max(META.w, META.h));
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(140, 200, 205, 0.055)";
    ctx.beginPath();
    for (let x = step; x < META.w; x += step) { ctx.moveTo(sx(x), y0); ctx.lineTo(sx(x), y0 + h); }
    for (let y = step; y < META.h; y += step) { ctx.moveTo(x0, sy(y)); ctx.lineTo(x0 + w, sy(y)); }
    ctx.stroke();
    ctx.strokeStyle = "rgba(94, 234, 212, 0.25)";
    ctx.strokeRect(x0 + 0.5, y0 + 0.5, w - 1, h - 1);
    if (!COMPACT) {
      ctx.fillStyle = "rgba(127, 152, 157, 0.75)";
      ctx.font = "600 10px Inter, sans-serif";
      ctx.fillText(`${META.w} × ${META.h} m · menzil r = ${META.r} m`, x0 + 8, y0 + h - 8);
      const bar = step * view.s, bx = x0 + w - bar - 10, by = y0 + h - 12;
      ctx.strokeStyle = "rgba(230, 244, 242, 0.55)";
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + bar, by); ctx.moveTo(bx, by - 4); ctx.lineTo(bx, by + 4);
      ctx.moveTo(bx + bar, by - 4); ctx.lineTo(bx + bar, by + 4); ctx.stroke();
      ctx.fillText(`${step} m`, bx + bar / 2 - 12, by - 6);
    }
  }
  function strokePairs(list, style, width, alpha, dash, offset = 0) {
    if (!list.length || alpha <= 0.002) return;
    ctx.save();
    ctx.globalAlpha = alpha; ctx.strokeStyle = style; ctx.lineWidth = width;
    if (dash) { ctx.setLineDash(dash); ctx.lineDashOffset = offset; }
    ctx.beginPath();
    for (let j = 0; j < list.length; j += 2) {

      ring.rotation.x = -Math.PI / 2; ring.visible = false; scene.add(ring); return ring;
    });
    const orbit = { theta: 0.6, phi: 0.98, radius: Math.max(W, H) * 1.08, drag: null, idle: 0 };
    const el = renderer.domElement;
    el.addEventListener("pointerdown", (e) => { orbit.drag = { x: e.clientX, y: e.clientY, moved: 0 }; el.setPointerCapture(e.pointerId); });
    el.addEventListener("pointermove", (e) => {
      if (!orbit.drag) return;
      const dx = e.clientX - orbit.drag.x, dy = e.clientY - orbit.drag.y;
      orbit.drag.x = e.clientX; orbit.drag.y = e.clientY; orbit.drag.moved += Math.abs(dx) + Math.abs(dy);
      orbit.theta -= dx * 0.008; orbit.phi = Math.min(1.45, Math.max(0.2, orbit.phi - dy * 0.006)); orbit.idle = performance.now();
    });
    el.addEventListener("pointerup", (e) => { const click = orbit.drag && orbit.drag.moved < 5; orbit.drag = null; if (click) pick3d(e); });
    el.addEventListener("wheel", (e) => {
      e.preventDefault();
      orbit.radius = Math.min(Math.max(W, H) * 3, Math.max(1.5, orbit.radius * (1 + Math.sign(e.deltaY) * 0.08)));
      orbit.idle = performance.now();
    }, { passive: false });
    Object.assign(v3, { T, renderer, scene, camera, nodes, glow, edges, stems, rings, orbit, color, packets, halos, shadows, shocks,
      turn: new T.Quaternion(), spin: new T.Quaternion(), axis: new T.Vector3(), up: new T.Vector3(0, 1, 0),
      spot: new T.Vector3(), size: new T.Vector3(),
      matrix: new T.Matrix4(), target: new T.Vector3(0, 0.45, 0), probe: new T.Vector3(), world: new Float32Array(N * 3),
      heat: new Float32Array(N), intro: performance.now(), ready: true });
    layout3d();
  }
  function layout3d() {
    if (!v3.ready) return;
    const box = stage.getBoundingClientRect();
    v3.renderer.setSize(Math.max(1, box.width), Math.max(1, box.height), false);
    v3.renderer.domElement.style.width = box.width + "px"; v3.renderer.domElement.style.height = box.height + "px";
    v3.camera.aspect = box.width / Math.max(1, box.height); v3.camera.updateProjectionMatrix();
  }
  function pick3d(event) {
    if (COMPACT) { setPlaying(!state.playing); return; }
    const box = v3.renderer.domElement.getBoundingClientRect(), x = event.clientX - box.left, y = event.clientY - box.top;
    let best = -1, bestDistance = 18 * 18;
    for (let i = 0; i < N; i++) {
      v3.probe.set(v3.world[3 * i], v3.world[3 * i + 1], v3.world[3 * i + 2]).project(v3.camera);
      const d = (((v3.probe.x + 1) / 2) * box.width - x) ** 2 + (((1 - v3.probe.y) / 2) * box.height - y) ** 2;
      if (d < bestDistance) { best = i; bestDistance = d; }
    }
    if (best < 0) { state.selected = -1; $("inspector").classList.remove("open"); return; }
    state.selected = best; inspect(best);
  }
  function render3d(k, k1, alpha, time, dt) {
    const { nodes, glow, edges, stems, rings, orbit, camera, renderer, matrix, color, world, target } = v3;
    const p = FR[k].p, q = FR[k1].p, infA = infected(k), infB = infected(k1), health = state.layer === "health";
    const gp = glow.geometry.attributes.position.array, gc = glow.geometry.attributes.color.array;
    const sp = stems.geometry.attributes.position.array, sc = stems.geometry.attributes.color.array;
    for (let i = 0; i < N; i++) {
      const x = (p[2 * i] + (q[2 * i] - p[2 * i]) * alpha - META.w / 2) * UNIT;
      const z = -(p[2 * i + 1] + (q[2 * i + 1] - p[2 * i + 1]) * alpha - META.h / 2) * UNIT;
      const y = altitude(i, time);
      world[3 * i] = x; world[3 * i + 1] = y; world[3 * i + 2] = z;
      const a = infA.has(i), b = infB.has(i), t = a === b ? (a ? 1 : 0) : b ? ease(alpha) : 1 - ease(alpha);
      v3.heat[i] = t;
      const rgb = health ? mix(COLOR.mint, COLOR.red, t) : layerColor(i, k);
      const scale = 1 + (health ? 0.4 * t * (0.5 + 0.5 * Math.sin(time * 5 + i)) : 0) + (i === state.selected ? 0.6 : 0);
      // Lean into the direction of travel and yaw slowly, like a hovering quadcopter.
      const dx = q[2 * i] - p[2 * i], dz = -(q[2 * i + 1] - p[2 * i + 1]), moving = Math.hypot(dx, dz);
      if (moving > 1e-6) v3.turn.setFromAxisAngle(v3.axis.set(dz / moving, 0, -dx / moving), 0.3);
      else v3.turn.identity();
      v3.turn.multiply(v3.spin.setFromAxisAngle(v3.up, time * 0.6 + i));
      matrix.compose(v3.spot.set(x, y, z), v3.turn, v3.size.set(scale, scale, scale));
      nodes.setMatrixAt(i, matrix);
      v3.shadows.geometry.attributes.position.array.set([x, 0.004, z], 3 * i);
      nodes.setColorAt(i, color.setRGB(rgb[0] / 255, rgb[1] / 255, rgb[2] / 255));
      const glowRgb = !health && t > 0.5 ? COLOR.red : i === state.selected ? COLOR.white : rgb;
      const g = i === state.selected ? 0.9 : health ? 0.22 + 0.78 * t : t > 0.5 ? 0.8 : 0.4;
      gp[3 * i] = x; gp[3 * i + 1] = y; gp[3 * i + 2] = z;
      gc[3 * i] = (glowRgb[0] / 255) * g; gc[3 * i + 1] = (glowRgb[1] / 255) * g; gc[3 * i + 2] = (glowRgb[2] / 255) * g;
      sp.set([x, 0, z, x, y, z], 6 * i);
      sc.set([0.05, 0.14, 0.16, 0.2 + 0.5 * t, 0.42, 0.45], 6 * i);
    }
    nodes.instanceMatrix.needsUpdate = true; nodes.instanceColor.needsUpdate = true;
    glow.geometry.attributes.position.needsUpdate = true; glow.geometry.attributes.color.needsUpdate = true;
    stems.geometry.setDrawRange(0, 2 * N);
    stems.geometry.attributes.position.needsUpdate = true; stems.geometry.attributes.color.needsUpdate = true;

    const hp = v3.halos.geometry.attributes.position.array, hc = v3.halos.geometry.attributes.color.array;
    for (let i = 0; i < N; i++) {
      const heat = 0.3 * v3.heat[i] * (0.8 + 0.2 * Math.sin(time * 3 + i));
      hp.set([world[3 * i], 0.01, world[3 * i + 2]], 3 * i);
      hc.set([heat, heat * 0.22, heat * 0.3], 3 * i);
    }
    v3.halos.geometry.setDrawRange(0, N);
    v3.halos.geometry.attributes.position.needsUpdate = true; v3.halos.geometry.attributes.color.needsUpdate = true;

    const kp = v3.packets.geometry.attributes.position.array, kc = v3.packets.geometry.attributes.color.array;
    let sent = 0;
    if (k1 !== k && health) {
      const pairs = transmissions(k1), travel = ease(Math.min(1, alpha * 1.15));
      for (let j = 0; j < pairs.length && sent < 256; j += 2, sent++) {
        const a = 3 * pairs[j], b = 3 * pairs[j + 1];
        kp.set([world[a] + (world[b] - world[a]) * travel, world[a + 1] + (world[b + 1] - world[a + 1]) * travel,
          world[a + 2] + (world[b + 2] - world[a + 2]) * travel], 3 * sent);
        kc.set([1, 0.6, 0.66], 3 * sent);
      }
    }
    v3.packets.geometry.setDrawRange(0, sent);
    v3.packets.geometry.attributes.position.needsUpdate = true; v3.packets.geometry.attributes.color.needsUpdate = true;
    v3.shadows.geometry.attributes.position.needsUpdate = true;

    let shocked = 0;
    if (k1 !== k && health) {
      for (const [kind, node] of FR[k1].ev) {
        if (kind !== "infected" || shocked >= v3.shocks.length) continue;
        const ring = v3.shocks[shocked++], reach = Math.max(0.02, META.r * UNIT * ease(alpha));
        ring.visible = true; ring.position.set(world[3 * node], 0.012, world[3 * node + 2]); ring.scale.set(reach, reach, reach);
        ring.material.opacity = 0.6 * (1 - alpha);
      }
    }
    for (; shocked < v3.shocks.length; shocked++) v3.shocks[shocked].visible = false;

    const ep = edges.geometry.attributes.position.array, ec = edges.geometry.attributes.color.array;
    let count = 0;
    const push = (a, b, rgb, intensity) => {
      ep.set([world[3 * a], world[3 * a + 1], world[3 * a + 2], world[3 * b], world[3 * b + 1], world[3 * b + 2]], 6 * count);
      const r = (rgb[0] / 255) * intensity, g = (rgb[1] / 255) * intensity, bl = (rgb[2] / 255) * intensity;
      ec.set([r, g, bl, r, g, bl], 6 * count);
      count++;
    };
    const e = FR[k].e, s = health ? null : spectral(k);
    for (let j = 0; j < e.length; j += 2) {
      const a = e[j], b = e[j + 1];
      if (health) { const hot = infA.has(a) !== infA.has(b); push(a, b, hot ? COLOR.red : COLOR.edge, hot ? 0.8 : 0.3); }
      else if (state.layer === "perron") push(a, b, COLOR.amber, 0.1 + 0.9 * ((s.u[a] * s.u[b]) / s.maxP));
      else if (s.v) { const cut = s.v[a] * s.v[b] < 0; push(a, b, cut ? COLOR.amber : s.v[a] >= 0 ? COLOR.cyan : COLOR.violet, cut ? 1 : 0.32); }
    }
    for (let j = 0; j < FR[k].a.length; j += 2) push(FR[k].a[j], FR[k].a[j + 1], COLOR.cyan, 1);
    for (let j = 0; j < FR[k].x.length; j += 2) push(FR[k].x[j], FR[k].x[j + 1], COLOR.red, 0.3);
    if (state.selected >= 0) for (const j of adjacency(k)[state.selected]) push(state.selected, j, COLOR.white, 0.9);
    edges.geometry.setDrawRange(0, 2 * count);
    edges.geometry.attributes.position.needsUpdate = true; edges.geometry.attributes.color.needsUpdate = true;

    let used = 0;
    for (const node of FR[k].q) {
      if (used >= rings.length) break;
      const ring = rings[used++];
      ring.visible = true; ring.position.set(world[3 * node], world[3 * node + 1], world[3 * node + 2]); ring.rotation.z = time * 1.5;
    }
    for (; used < rings.length; used++) rings[used].visible = false;

    if ((state.playing || COMPACT) && performance.now() - orbit.idle > 2500) orbit.theta += dt * 0.08;
    // Cinema mode: glide towards the centre of the outbreak and breathe the distance.
    const cinema = state.cinema || COMPACT;
    let fx = 0, fz = 0, focus = 0;
    if (cinema) for (let i = 0; i < N; i++) if (infA.has(i)) { fx += world[3 * i]; fz += world[3 * i + 2]; focus++; }
    const goalX = cinema && focus ? fx / focus : 0, goalZ = cinema && focus ? fz / focus : 0;
    target.x += (goalX - target.x) * 0.025; target.z += (goalZ - target.z) * 0.025;
    const breathe = cinema ? 0.8 + 0.08 * Math.sin(time * 0.35) : 1;
    // Entering 3D, the camera swoops in from higher and further away.
    const settle = 1 - ease(Math.min(1, (performance.now() - v3.intro) / 1600));
    const radius = orbit.radius * breathe * (1 + 0.75 * settle), phi = Math.max(0.15, orbit.phi - 0.45 * settle);
    const theta = orbit.theta - 0.9 * settle;
    camera.position.set(
      target.x + radius * Math.sin(phi) * Math.sin(theta),
      target.y + radius * Math.cos(phi),
      target.z + radius * Math.sin(phi) * Math.cos(theta));
    camera.lookAt(target);
    renderer.render(v3.scene, camera);
  }

  // Loop -------------------------------------------------------------------------------------
  function frame(now) {
    // rAF timestamps can precede the script's own clock, so never let time run backwards.
    const dt = Math.max(0, Math.min(0.25, (now - state.last) / 1000));
    state.last = now;
    if (state.playing && !state.drag) {
      state.tau += dt * BASE_FPS * state.speed;
      if (state.tau >= LAST) {
        if (state.loop) state.tau = 0;
        else { state.tau = LAST; setPlaying(false); showFinale(); }
      }
      // The leading duel player keeps the other one on the same frame.
      if (channel && META.leader && now - (state.tick || 0) > 500) { state.tick = now; share("tick"); }
    }
    render(now / 1000, dt);
    requestAnimationFrame(frame);
  }
  new ResizeObserver(layout).observe(root);
  layout();
  buildLegend();
  setPlaying(state.playing);
  if (META.view === "3d") setView("3d");
  if (META.badge) { $("badge").textContent = META.badge; $("badge").style.display = "inline-block"; }
  if (channel) channel.onmessage = ({ data }) => {
    if (!data || data.from === SELF) return;
    const tau = Math.min(LAST, Math.max(0, data.progress * LAST));
    if (data.kind === "tick") { if (state.playing && Math.abs(tau - state.tau) > 0.12) state.tau = tau; return; }
    if (data.kind === "layer") { setLayer(data.layer); return; }
    if (data.kind === "view") { setView(data.view); return; }
    state.tau = tau; setSpeed(data.speed); setPlaying(data.playing);
    if (!data.playing) hideFinale();
  };
  if (META.notice) {
    const item = document.createElement("div"); item.textContent = META.notice; $("feed").appendChild(item);
    setTimeout(() => item.remove(), 6000);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
