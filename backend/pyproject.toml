[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmguard"
version = "0.1.0"
description = "Dynamic UAV cyber-resilience simulation core"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "networkx>=3.3,<4",
  "numpy>=2.0,<3",
  "pyarrow>=18,<22",
  "pydantic>=2.10,<3",
  "scipy>=1.13,<2",
  "starlette>=0.46,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "plotly>=5.24,<7",
  "pytest>=8.3",
  "ruff>=0.9",
]
dashboard = [
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "streamlit>=1.42,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
